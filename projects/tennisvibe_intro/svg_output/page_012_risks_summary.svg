  <text x="474" y="568" font-size="11" font-weight="700" fill="#B8E600">→ 推荐 A · 控制台 + 一人值守</text>

  <!-- Decision 3 -->
  <rect x="844" y="468" width="372" height="120" rx="10" fill="#1F2A37"/>
  <text x="864" y="498" font-size="14" font-weight="700" fill="#B8E600">D3 · 城市节奏</text>
  <text x="864" y="524" font-size="11" fill="#FFFFFF">A  单一城市深耕（上海/北京）</text>
  <text x="864" y="542" font-size="11" fill="#FFFFFF">B  多城市并行（3 城 + 5 球馆）</text>
  <text x="864" y="568" font-size="11" font-weight="700" fill="#B8E600">→ 推荐 A · 单城 50 球馆 / 100 教练</text>

