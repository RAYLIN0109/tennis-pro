  <rect x="64"  y="468" width="370" height="120" rx="10" fill="#1F2A37"/>
  <text x="84"  y="498" font-size="14" font-weight="700" fill="#B8E600">D1 · 支付模式</text>
  <text x="84"  y="524" font-size="11" fill="#FFFFFF">A  微信支付（需要 ICP+商户号）</text>
  <text x="84"  y="542" font-size="11" fill="#FFFFFF">B  平台代收（先跑通 + 财务兜底）</text>
  <text x="84"  y="568" font-size="11" font-weight="700" fill="#B8E600">→ 推荐 B · 先 90 天跑通业务再切换</text>

