  <g>
    <!-- Row 1 -->
    <rect x="478" y="296" width="162" height="52" rx="6" fill="#E6F7C8"/>
    <text x="559" y="320" font-size="13" font-weight="700" fill="#1F2A37" text-anchor="middle">user</text>
    <text x="559" y="338" font-size="10" fill="#777777" text-anchor="middle">4 actions · 登录/资料</text>

    <rect x="650" y="296" width="162" height="52" rx="6" fill="#E6F7C8"/>
    <text x="731" y="320" font-size="13" font-weight="700" fill="#1F2A37" text-anchor="middle">coach</text>
    <text x="731" y="338" font-size="10" fill="#777777" text-anchor="middle">7 actions · 申请/审核</text>

    <!-- Row 2 -->
    <rect x="478" y="356" width="162" height="52" rx="6" fill="#E6F7C8"/>
    <text x="559" y="380" font-size="13" font-weight="700" fill="#1F2A37" text-anchor="middle">order</text>
    <text x="559" y="398" font-size="10" fill="#777777" text-anchor="middle">6 actions · 下单/支付</text>

    <rect x="650" y="356" width="162" height="52" rx="6" fill="#E6F7C8"/>
    <text x="731" y="380" font-size="13" font-weight="700" fill="#1F2A37" text-anchor="middle">review</text>
    <text x="731" y="398" font-size="10" fill="#777777" text-anchor="middle">4 actions · 评价/统计</text>

    <!-- Row 3 -->
    <rect x="478" y="416" width="162" height="52" rx="6" fill="#E6F7C8"/>
    <text x="559" y="440" font-size="13" font-weight="700" fill="#1F2A37" text-anchor="middle">schedule</text>
    <text x="559" y="458" font-size="10" fill="#777777" text-anchor="middle">4 actions · 原子预约</text>

    <rect x="650" y="416" width="162" height="52" rx="6" fill="#E6F7C8"/>
    <text x="731" y="440" font-size="13" font-weight="700" fill="#1F2A37" text-anchor="middle">venue</text>
    <text x="731" y="458" font-size="10" fill="#777777" text-anchor="middle">3 actions · 只读</text>

    <!-- Row 4 -->
    <rect x="478" y="476" width="162" height="52" rx="6" fill="#FFE7C2"/>
    <text x="559" y="500" font-size="13" font-weight="700" fill="#1F2A37" text-anchor="middle">activity</text>
    <text x="559" y="518" font-size="10" fill="#FF8A00" text-anchor="middle">3 actions · 占位中</text>

    <rect x="650" y="476" width="162" height="52" rx="6" fill="#E6F7C8"/>
    <text x="731" y="500" font-size="13" font-weight="700" fill="#1F2A37" text-anchor="middle">notification</text>
    <text x="731" y="518" font-size="10" fill="#777777" text-anchor="middle">3 actions · 已读/未读</text>
  </g>

  <text x="640" y="572" font-size="11" fill="#777777" text-anchor="middle">统一：exports.main · switch(action)</text>

  <!-- Arrow 2 -->
  <g transform="translate(828,420)">
    <polygon points="0,0 24,0 24,-8 36,4 24,16 24,8 0,8" fill="#B8E600"/>
  </g>

