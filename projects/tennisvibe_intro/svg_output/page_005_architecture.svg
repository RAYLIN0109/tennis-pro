  <rect x="852" y="210" width="364" height="420" rx="12" fill="#FFFFFF" stroke="#E5E5E0"/>
  <rect x="852" y="210" width="364" height="40" rx="12" fill="#B8E600"/>
  <rect x="852" y="230" width="364" height="20" fill="#B8E600"/>
  <text x="1034" y="236" font-size="16" font-weight="700" fill="#1F2A37" text-anchor="middle">云数据库 / 存储</text>

  <text x="872" y="282" font-size="13" font-weight="700" fill="#1F2A37">8 张集合</text>
  <g font-size="12" fill="#333333">
    <text x="888" y="306">·  users</text>
    <text x="1000" y="306" fill="#777777">用户档案</text>

    <text x="888" y="328">·  coaches</text>
    <text x="1000" y="328" fill="#777777">教练扩展资料</text>

    <text x="888" y="350">·  orders</text>
    <text x="1000" y="350" fill="#777777">订单</text>

    <text x="888" y="372">·  reviews</text>
    <text x="1000" y="372" fill="#777777">评价</text>

    <text x="888" y="394">·  schedules</text>
    <text x="1000" y="394" fill="#777777">排期（多态）</text>

    <text x="888" y="416">·  venues</text>
    <text x="1000" y="416" fill="#777777">场地</text>

    <text x="888" y="438">·  activities</text>
    <text x="1000" y="438" fill="#777777">活动</text>

    <text x="888" y="460">·  notifications</text>
    <text x="1000" y="460" fill="#777777">通知</text>
  </g>

  <line x1="872" y1="478" x2="1196" y2="478" stroke="#E5E5E0"/>
  <text x="872" y="500" font-size="13" font-weight="700" fill="#1F2A37">云存储</text>
  <g font-size="11" fill="#777777">
    <text x="872" y="522">·  头像 / 认证图片 / 评价图</text>
    <text x="872" y="540">·  唯一索引：_openid · user_id</text>
    <text x="872" y="558">·  复合索引：status + created_at</text>
  </g>

  <!-- Bottom note -->
  <text x="640" y="666" font-size="11" fill="#777777" text-anchor="middle">调用链路：wx.cloud.callFunction({ name, data: { action, ... } }) → switch 路由 → actions/&lt;name&gt;.js → db.collection()</text>

  <!-- Footer -->
  <text x="64" y="700" font-size="10" fill="#777777">TennisVibe · 网球生态小程序项目介绍</text>
  <text x="1216" y="700" font-size="10" fill="#777777" text-anchor="end">05 / 12</text>
</svg>
