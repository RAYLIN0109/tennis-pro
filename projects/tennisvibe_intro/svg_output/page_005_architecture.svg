  <rect x="458" y="210" width="364" height="40" rx="12" fill="#B8E600"/>
  <rect x="458" y="230" width="364" height="20" fill="#B8E600"/>
  <text x="640" y="236" font-size="14" font-weight="700" fill="#1F2A37" text-anchor="middle">云函数层（8 模块）</text>

  <text x="478" y="278" font-size="11" fill="#777777" text-anchor="middle">34 actions · 91% 已实现</text>

