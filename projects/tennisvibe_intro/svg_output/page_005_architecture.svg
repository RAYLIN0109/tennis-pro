  <rect x="64" y="230" width="364" height="20" fill="#B8E600"/>
  <text x="246" y="236" font-size="16" font-weight="700" fill="#1F2A37" text-anchor="middle">小程序端</text>

  <text x="84" y="284" font-size="13" font-weight="700" fill="#1F2A37">Pages (21)</text>
  <g font-size="11" fill="#333333">
    <text x="84" y="308">·  首页 / 网球圈 / 我的</text>
    <text x="84" y="328">·  教练  列表·详情·预约</text>
    <text x="84" y="348">·  活动  列表·详情·创建</text>
    <text x="84" y="368">·  订单  列表·详情</text>
    <text x="84" y="388">·  评价  创建·列表</text>
    <text x="84" y="408">·  用户  登录·资料·设置</text>
  </g>

  <text x="84" y="448" font-size="13" font-weight="700" fill="#1F2A37">Components (8)</text>
  <g font-size="11" fill="#333333">
    <text x="84" y="472">rating-stars · status-badge</text>
    <text x="84" y="492">empty-state · price-display</text>
    <text x="84" y="512">skeleton-loader · user-card</text>
    <text x="84" y="532">search-bar · time-slot-picker</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(434,420)">
    <polygon points="0,0 24,0 24,-8 36,4 24,16 24,8 0,8" fill="#B8E600"/>
  </g>

